<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustrated Rwandan hillside road at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2B1F"/>
      <stop offset="55%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5E0D8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E5E0D8" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="250" r="90" fill="#D4A017" opacity="0.18"/>
  <circle cx="1180" cy="250" r="52" fill="#D4A017" opacity="0.30"/>

  <!-- Layered hills, back to front -->
  <path d="M0 560 Q 260 452 520 528 T 1040 500 T 1600 556 L1600 900 L0 900 Z" fill="#0F2B1F" opacity="0.42"/>
  <path d="M0 632 Q 300 528 640 604 T 1240 588 T 1600 640 L1600 900 L0 900 Z" fill="#0F2B1F" opacity="0.62"/>
  <path d="M0 716 Q 380 620 760 700 T 1600 724 L1600 900 L0 900 Z" fill="#0F2B1F" opacity="0.82"/>

  <!-- Road receding to the horizon -->
  <path d="M742 700 L858 700 L1080 900 L520 900 Z" fill="url(#road)"/>
  <g stroke="#E5E0D8" stroke-opacity="0.5" stroke-linecap="round">
    <line x1="798" y1="716" x2="800" y2="744" stroke-width="3"/>
    <line x1="796" y1="772" x2="800" y2="812" stroke-width="5"/>
    <line x1="792" y1="844" x2="800" y2="896" stroke-width="7"/>
  </g>
</svg>